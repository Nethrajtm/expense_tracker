    <meta name="description" content="AI-Assisted Expense Tracker — Track, analyse, and manage your daily expenses." />

    <script>
      try {
        var savedTheme = JSON.parse(localStorage.getItem("expense_tracker_theme"));

          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
